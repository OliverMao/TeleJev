<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeleJev completions 测试</title>
<style>
  :root { color-scheme: light dark; --line: #d0d7de; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 1000px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; font-size: 13px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 16px; }
  legend { padding: 0 6px; font-weight: 600; font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
  textarea, input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  textarea { resize: vertical; }
  .server { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .server input { flex: 1 1 240px; }
  button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { padding: 4px 10px; font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .status { font-size: 13px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  #result { display: none; }
  .verdict { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 13px; }
  .chip.empty { background: #0002; color: #666; }
  .prob { display: grid; grid-template-columns: 96px 1fr 56px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .bar { height: 14px; background: #0001; border-radius: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .kv { display: inline-grid; margin-right: 18px; }
  .kv .k { font-size: 12px; color: #666; }
  .kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  pre { background: #0000000d; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12.5px; }
  .muted { color: #666; font-size: 12px; }
</style>
</head>
<body>
  <h1>TeleJev · /v1/chat/completions 测试</h1>
  <p class="sub">像用普通模型一样：填提示词、可选附图像，调用一次 completions，查看 <code>{"has_person": 0|1, "violations": [...]}</code>。服务端需以 <code>--backend sglang|vllm</code> 启动。</p>

  <div class="server">
    <label style="margin:0" for="base">服务地址</label>
    <input id="base" type="text" value="http://127.0.0.1:22001">
    <label style="margin:0" for="model">model</label>
    <input id="model" type="text" value="telejev" style="flex:0 1 200px">
    <button id="health" class="ghost">检查 /health</button>
    <span id="status" class="status"></span>
  </div>

  <fieldset>
    <legend>system 提示词</legend>
    <textarea id="systemText" rows="10">你是一名实时视频流助手，逐帧观察连续的摄像头画面，并按要求判定当前是否存在指定的监测行为。

【最重要的判定原则】
你输出的结论必须且只能反映【最后一帧】的状态。例如前 10 帧出现过某行为、后 10 帧已恢复正常，则不得报告该行为。
- 历史帧仅作为连续运动趋势的辅助参考。
- 只有当某个行为在【最后一帧当下仍在发生或仍然保持该姿态】时，才计入。
- 不要累计、沿用、记忆历史帧中已结束的行为。

【输出格式】
严格输出如下 JSON，不要添加任何多余文本或解释，不要开启思考模式：
{"has_person": 0 或 1, "violations": ["行为名称", ...]}
- has_person：最后一帧是否有人（1 有 / 0 无 / -1 无法判断）。
- violations：最后一帧当下仍在发生的行为名称，必须逐字使用任务清单中的名称；没有则 []。</textarea>
  </fieldset>

  <fieldset>
    <legend>user 提示词（任务清单）</legend>
    <textarea id="userText" rows="12">【本摄像头的监测任务清单】
请只判定下列行为；violations 中必须逐字使用下列【任务名称】：

1. 任务名称：摔倒
   判定标准：只要【最后一帧】人体出现趴卧在地、双膝跪伏、平躺、侧卧或直接坐在地板上（无座椅支撑），都要判定为“摔倒”；最后一帧已站起则【不报】。
2. 任务名称：挥手
   判定标准：【最后一帧】手部有大幅度挥动（手腕超过头顶）；不要把打电话误识别为挥手。
3. 任务名称：捂胸口
   判定标准：【最后一帧】手部按在胸口/胸前区域，可能伴随身体前倾或不适姿态；手已放下则【不报】。

【判定要求】
- 只依据最后一帧的当下状态判定，历史帧仅作趋势参考。
- violations 中的名称必须与上面【任务名称】完全一致。
- 没有命中的任务不要出现在 violations 中；全部未命中时为 []。</textarea>
    <label for="tasks">tasks（可选，逗号分隔；留空则从提示词里的“任务名称：X”解析）</label>
    <input id="tasks" type="text" placeholder="摔倒, 挥手, 捂胸口">
  </fieldset>

  <fieldset>
    <legend>图像（可选）</legend>
    <input type="file" id="imageFile" accept="image/*" multiple>
    <button id="sampleImage" class="ghost">加载示例图</button>
    <button id="clearImage" class="ghost">清除图像</button>
    <div id="imageInfo" class="muted">可多选（如连续 20 帧）</div>
    <img id="imagePreview" alt="" style="display:none;max-width:260px;max-height:200px;margin-top:8px;border-radius:6px;border:1px solid var(--line)">
  </fieldset>

  <div class="actions">
    <button id="run" class="primary">调用 /v1/chat/completions</button>
  </div>

  <section id="result">
    <div class="verdict" id="verdict"></div>
    <div class="chips" id="chips"></div>
    <div id="timing" class="muted" style="margin-bottom:12px"></div>
    <h3 style="font-size:13px;margin:14px 0 6px">各任务概率（A=命中 / B=未命中）</h3>
    <div id="probs"></div>
    <h3 style="font-size:13px;margin:14px 0 6px">assistant content</h3>
    <pre id="content"></pre>
    <h3 style="font-size:13px;margin:14px 0 6px">原始响应</h3>
    <pre id="raw"></pre>
  </section>

let images = [];

function setStatus(text, ok) {
  const node = $("status");
  node.textContent = text;
  node.className = "status " + (ok ? "ok" : ok === false ? "bad" : "");
}
function escapeAttr(value) {
  return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function bar(label, value) {
  return `<span class="bar"><i style="width:${(Number(value) * 100).toFixed(1)}%"></i></span><span>${(Number(value) * 100).toFixed(1)}%</span>`;
}
function setPreview() {
  if (!images.length) {
    $("imagePreview").style.display = "none";
    $("imagePreview").removeAttribute("src");
    $("imageInfo").textContent = "可多选（如连续 20 帧）";
    return;
  }
  $("imagePreview").src = images[0];
  $("imagePreview").style.display = "block";
  $("imageInfo").textContent = `已选 ${images.length} 张（预览第 1 张）`;
}

function buildMessages() {
  const system = $("systemText").value;
  const userText = $("userText").value;
  const content = images.map((url) => ({ type: "image_url", image_url: { url } }));
  content.push({ type: "text", text: userText });
  return [
    { role: "system", content: system },
    { role: "user", content: content.length > 1 ? content : userText },
  ];
}

function renderProbs(detail) {
  const box = $("probs");
  box.innerHTML = "";
  const rows = [["（有人）", detail.has_person_probabilities || {}]];
  Object.entries(detail.violation_probabilities || {}).forEach(([name, probs]) => rows.push([name, probs]));
  rows.forEach(([name, probs]) => {
    const a = probs.A ?? 0;
    const b = probs.B ?? 0;
    const div = document.createElement("div");
    div.className = "prob";
    div.innerHTML = `<span>${escapeAttr(name)}</span><span>A</span>${bar("A", a)}<span>B</span>${bar("B", b)}`;
    box.appendChild(div);
  });
}

async function run() {
  $("result").style.display = "block";
  $("verdict").textContent = "";
  $("chips").innerHTML = "";
  $("probs").innerHTML = "";
  $("timing").textContent = "";
  $("content").textContent = "";
  $("raw").textContent = "";
  setStatus("调用中…");

  const tasksRaw = $("tasks").value.trim();
  const body = { model: $("model").value, messages: buildMessages() };
  if (tasksRaw) body.tasks = tasksRaw.split(/[,，\s]+/).filter(Boolean);

  try {
    const response = await fetch(BASE() + "/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const text = await response.text();
    let data = null;
    try { data = JSON.parse(text); } catch (error) { data = null; }
    if (!response.ok) throw new Error(`HTTP ${response.status} ${data?.error?.message || text.slice(0, 300)}`);

    const content = data.choices[0].message.content;
    const decision = JSON.parse(content);
    $("verdict").innerHTML = `has_person：<span style="color:${decision.has_person ? "var(--bad)" : "var(--ok)"}">${decision.has_person}</span>`;
    const violations = decision.violations || [];
    $("chips").innerHTML = violations.length
      ? violations.map((name) => `<span class="chip">${escapeAttr(name)}</span>`).join("")
      : '<span class="chip empty">无违规</span>';

    const detail = data.telejev || {};
    $("timing").textContent = `${images.length ? images.length + " 张图像 · " : ""}请求数 ${detail.requests ?? "?"}（并发 ${detail.concurrency ?? "?"}） · 预热 ${detail.prefix_warmup ? "是" : "否"} · 缓存命中 ${detail.cached_tokens ?? 0} tokens · 总耗时 ${(detail.total_seconds ?? 0).toFixed(4)} s · 顺序和 ${(detail.sum_request_seconds ?? 0).toFixed(4)} s · prompt_tokens ${data.usage?.prompt_tokens ?? "?"}`;
    renderProbs(detail);
    $("content").textContent = content;
    $("raw").textContent = JSON.stringify(data, null, 2);
    setStatus("成功", true);
  } catch (error) {
    setStatus("失败：" + error.message, false);
    $("raw").textContent = error.message;
  }
}

$("health").addEventListener("click", async () => {
  setStatus("检查中…");
  try {
    const response = await fetch(BASE() + "/health");
    const body = await response.json();
    setStatus("服务正常：" + JSON.stringify(body), response.ok);
  } catch (error) {
    setStatus("无法连接：" + error.message, false);
  }
});
$("imageFile").addEventListener("change", (event) => {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  Promise.all(files.map((file) => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  }))).then((results) => {
    images = results;
    setPreview();
  });
});
$("clearImage").addEventListener("click", () => {
  images = [];
  $("imageFile").value = "";
  setPreview();
});
$("sampleImage").addEventListener("click", () => {
  images = [SAMPLE_IMAGE];
  setPreview();
});
$("run").addEventListener("click", run);

window.addEventListener("load", () => $("health").click());
</script>
</body>
</html>
