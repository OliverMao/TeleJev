<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeleJev 多任务判定测试</title>
<style>
  :root { color-scheme: light dark; --line: #d0d7de; --accent: #2563eb; --ok: #16a34a; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 960px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 20px; font-size: 13px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 16px; }
  legend { padding: 0 6px; font-weight: 600; font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input[type="text"], select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
  .server { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .server input { flex: 1 1 260px; }
  button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { padding: 4px 10px; font-size: 13px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .status { font-size: 13px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .tasks label { display: flex; gap: 8px; align-items: center; margin: 0; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .tasks input { margin: 0; }
  #results { display: none; }
  .timing { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .kv { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .kv .k { font-size: 12px; color: #666; }
  .kv .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .task-result { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .task-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .task-name { font-weight: 700; }
  .verdict { font-weight: 700; }
  .verdict.yes { color: var(--bad); }
  .verdict.no { color: var(--ok); }
  .meta { color: #666; font-size: 12px; margin-top: 4px; }
  .bar-row { display: grid; grid-template-columns: 72px 1fr 72px; gap: 10px; align-items: center; margin-top: 8px; font-size: 13px; }
  .bar { height: 14px; background: #0001; border-radius: 7px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar-row.best .bar > i { background: var(--ok); }
  pre { background: #0000000d; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12.5px; }
  .muted { color: #666; font-size: 12px; }
</style>
</head>
<body>
  <h1>TeleJev 多任务判定测试</h1>
  <p class="sub">同一张画面，一次请求分别判定：打架 / 摔倒 / 挥手 / 捂胸口。先启动服务：<code>python serve.py --model Qwen/Qwen3.5-4B</code> 或 <code>python serve.py --fake</code></p>

  <div class="server">
    <label style="margin:0" for="base">服务地址</label>
    <input id="base" type="text" value="http://127.0.0.1:22001">
    <button id="health" class="ghost">检查 /health</button>
    <span id="status" class="status"></span>
  </div>

  <fieldset>
    <legend>画面（image）</legend>
    <input type="file" id="imageFile" accept="image/*">
    <button id="sampleImage" class="ghost">加载示例图</button>
    <button id="clearImage" class="ghost">清除图像</button>
    <div id="imageInfo" class="muted"></div>
    <img id="imagePreview" alt="" style="display:none;max-width:260px;max-height:200px;margin-top:8px;border-radius:6px;border:1px solid var(--line)">
  </fieldset>

  <fieldset>
    <legend>任务</legend>
    <div class="tasks" id="tasks"></div>
    <button id="toggleAll" class="ghost" style="margin-top:10px">全选 / 全不选</button>
  </fieldset>

  <div class="actions">
    <button id="run" class="primary">开始判定</button>
    <span class="muted">同一张图只 prefill 一次，判据批量一次：共 2 次前向。</span>
  </div>

  <section id="results">
    <div class="timing" id="timing"></div>
    <div id="cards"></div>
    <h3 style="font-size:13px;margin:18px 0 6px">原始响应</h3>
    <pre id="raw"></pre>
  </section>

const STATE = "监控画面截图。";

const TASKS = [
  { key: "fight", label: "打架", verb: "正在打架" },
  { key: "fall", label: "摔倒", verb: "正在摔倒或已经摔倒" },
  { key: "wave", label: "挥手", verb: "正在挥手" },
  { key: "chest", label: "捂胸口", verb: "正在捂胸口" },
];

let imageData = null;

function renderTasks() {
  const box = $("tasks");
  box.innerHTML = "";
  TASKS.forEach((task) => {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" data-key="${task.key}" checked> ${task.label}`;
    box.appendChild(label);
  });
}
function selectedTasks() {
  return TASKS.filter((task) => {
    const box = document.querySelector(`input[data-key="${task.key}"]`);
    return box && box.checked;
  });
}
function buildCriterion(task) {
  return {
    id: task.key,
    question: `画面中是否有人${task.verb}？`,
    options: [
      { id: "yes", description: `画面中有人${task.verb}。` },
      { id: "no", description: `画面中没有人${task.verb}。` },
    ],
  };
}

function setStatus(text, ok) {
  const node = $("status");
  node.textContent = text;
  node.className = "status " + (ok ? "ok" : ok === false ? "bad" : "");
}

function escapeAttr(value) {
  return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}
function seconds(value) {
  return value == null ? "?" : Number(value).toFixed(4) + " s";
}

function renderCard(task, decision) {
  const isYes = decision.option_id === "yes";
  const yes = decision.probabilities?.yes ?? (isYes ? 1 : 0);
  const bars = Object.entries(decision.probabilities || {})
    .map(([id, probability]) => {
      const best = id === decision.option_id;
      return `<div class="bar-row${best ? " best" : ""}">
        <span>${id === "yes" ? "有" : "无"}</span>
        <span class="bar"><i style="width:${(probability * 100).toFixed(1)}%"></i></span>
        <span>${(probability * 100).toFixed(1)}%</span>
      </div>`;
    })
    .join("");
  const card = document.createElement("div");
  card.className = "task-result";
  card.innerHTML = `
    <div class="task-head">
      <span class="task-name">${task.label}</span>
      <span class="verdict ${isYes ? "yes" : "no"}">${isYes ? "有" : "无"}（${(Number(yes) * 100).toFixed(1)}%）</span>
    </div>
    <div class="meta">${escapeAttr(decision.option_id)} · image_tokens=${decision.image_tokens ?? "?"} · input_tokens=${decision.input_tokens ?? "?"}</div>
    ${bars}`;
  return card;
}

function renderTiming(timing) {
  const box = $("timing");
  box.innerHTML = "";
  const items = [
    ["接口 → 推理完成", seconds(timing.total_seconds)],
    ["图像解码", seconds(timing.image_seconds)],
    ["prompt 编码", seconds(timing.encode_seconds)],
    ["图像 prefill", seconds(timing.prefill_seconds)],
    ["判据前向", seconds(timing.suffix_seconds)],
    ["任务数", timing.batch_size ?? "?"],
  ];
  items.forEach(([k, v]) => {
    const div = document.createElement("div");
    div.className = "kv";
    div.innerHTML = `<div class="k">${k}</div><div class="v">${escapeAttr(v)}</div>`;
    box.appendChild(div);
  });
}

async function postJson(path, body) {
  const response = await fetch(BASE() + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const text = await response.text();
  let data = null;
  try { data = JSON.parse(text); } catch (error) { data = null; }
  return { response, data, text };
}

function buildRow(task) {
  const criterion = buildCriterion(task);
  const row = { id: `${task.key}-${Date.now()}`, state: STATE, question: criterion.question, options: criterion.options };
  if (imageData) row.image = imageData;
  return row;
}

async function runBatch(tasks, body) {
  const { response, data, text } = await postJson("/decide-batch", body);
  if (response.status === 404) return null; // server predates /decide-batch
  if (!response.ok) throw new Error(`HTTP ${response.status} ${data?.error?.message || text.slice(0, 300)}`);
  data.results.forEach((decision, index) => $("cards").appendChild(renderCard(tasks[index], decision)));
  renderTiming(data.timing || {});
  $("raw").textContent = JSON.stringify(data, null, 2);
  return data;
}

async function runPerTask(tasks) {
  const responses = [];
  let total = 0;
  for (const task of tasks) {
    const { response, data, text } = await postJson("/decide", buildRow(task));
    if (!response.ok) throw new Error(`HTTP ${response.status} ${data?.error?.message || text.slice(0, 300)}`);
    $("cards").appendChild(renderCard(task, data));
    total += data.total_seconds || 0;
    responses.push({ task: task.key, response: data });
  }
  renderTiming({ total_seconds: total, batch_size: tasks.length, fallback: true });
  $("raw").textContent = JSON.stringify({ results: responses }, null, 2);
  return responses;
}

async function runAll() {
  const tasks = selectedTasks();
  if (!tasks.length) { setStatus("请至少勾选一个任务", false); return; }
  $("results").style.display = "block";
  $("cards").innerHTML = "";
  $("timing").innerHTML = "";
  $("raw").textContent = "";
  setStatus("判定中…");

  const body = { state: STATE, criteria: tasks.map(buildCriterion) };
  if (imageData) body.image = imageData;

  try {
    const batched = await runBatch(tasks, body);
    if (batched) { setStatus("完成（/decide-batch）", true); return; }
    setStatus("服务端无 /decide-batch（404），已回退逐任务 /decide；请更新并重启服务端", false);
    await runPerTask(tasks);
  } catch (error) {
    setStatus("失败：" + error.message, false);
    const card = document.createElement("div");
    card.className = "task-result";
    card.innerHTML = `<div class="meta">${escapeAttr(error.message)}</div>`;
    $("cards").appendChild(card);
    $("raw").textContent = error.message;
  }
}

$("health").addEventListener("click", async () => {
  setStatus("检查中…");
  try {
    const response = await fetch(BASE() + "/health");
    const body = await response.json();
    setStatus("服务正常：" + JSON.stringify(body), response.ok);
  } catch (error) {
    setStatus("无法连接：" + error.message, false);
  }
});

$("imageFile").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    imageData = reader.result;
    $("imagePreview").src = imageData;
    $("imagePreview").style.display = "block";
    $("imageInfo").textContent = `${file.name} · ${(file.size / 1024).toFixed(1)} KB`;
  };
  reader.readAsDataURL(file);
});
$("clearImage").addEventListener("click", () => {
  imageData = null;
  $("imageFile").value = "";
  $("imagePreview").style.display = "none";
  $("imagePreview").removeAttribute("src");
  $("imageInfo").textContent = "";
});
$("sampleImage").addEventListener("click", () => {
  imageData = SAMPLE_IMAGE;
  $("imagePreview").src = imageData;
  $("imagePreview").style.display = "block";
  $("imageInfo").textContent = "示例图 fall.png（内嵌）";
});
$("toggleAll").addEventListener("click", () => {
  const boxes = document.querySelectorAll('#tasks input[type="checkbox"]');
  const target = !Array.from(boxes).every((box) => box.checked);
  boxes.forEach((box) => { box.checked = target; });
});
$("run").addEventListener("click", runAll);

renderTasks();
window.addEventListener("load", () => $("health").click());
</script>
</body>
